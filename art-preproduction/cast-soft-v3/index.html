<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡牌释放 · 已接入v3</title>
<style>*{box-sizing:border-box}body{margin:0;color:#514c43;background:#f4efe5;font:14px/1.6 system-ui}main{max-width:1420px;margin:auto;padding:20px}h1{font-size:24px;margin:0}p{margin:7px 0 14px;color:#766d60}.tag{font-size:12px;background:#e8d9b8;border:1px solid #c5b18d;border-radius:14px;padding:3px 10px;vertical-align:middle}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px;border:1px solid #d1c4ad;background:#fffaf0;border-radius:10px;margin-bottom:12px}button,select{font:inherit;padding:5px 12px;color:#564e40;background:#f6efe1;border:1px solid #bcae94;border-radius:6px}label{display:flex;align-items:center;gap:8px}input{accent-color:#9a7a4c}#time{flex:1;min-width:180px}#phase{min-width:100px;color:#77603c}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.stage{border:1px solid #c7b89f;border-radius:12px;overflow:hidden;background:#ede4d4}#scene{width:100%;display:block}.detail{background:#fffaf1;border:1px solid #cdbfa6;border-radius:12px;padding:12px}.detail strong{font-size:14px}.detail canvas{display:block;width:100%;margin:10px 0;border-radius:8px;border:1px solid #d1c0a5}.detail p{font-size:12px;margin:8px 0}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.steps button{font-size:13px}.note{font-size:12px}button.active{background:#dfcba4;border-color:#977548}@media(max-width:900px){.layout{grid-template-columns:1fr}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail canvas{margin:0}.detail strong{grid-column:1/-1}main{padding:12px}}</style>
<main><h1>卡牌释放 · 正式效果v3 <span class="tag">已接入 · 大小1.5倍</span></h1><p>按确认的放大稿再放大至1.5倍。进攻为柔和红金色，控制为浅蓝白，强化为奶金白；与正式游戏使用同一效果。</p>
<div class="controls"><select id="type" aria-label="类型"><option value="attack">柔和红金 · 进攻</option><option value="control">浅蓝白 · 控制</option><option value="buff">奶金白 · 强化</option></select><button id="play">暂停</button><button id="restart">重播</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value=".6" selected>0.6倍慢速</option><option value=".35">0.35倍慢速</option></select><label>大小 <input id="amount" type="range" min=".75" max="2" step=".05" value="1.5"><span id="amount-label">1.5倍</span></label><button id="compare">查看旧版</button></div>
<div class="controls"><input id="time" aria-label="进度" type="range" min="0" max="1200" value="0" step="10"><span id="phase">手牌激活</span></div>
<div class="layout"><div class="stage"><canvas id="scene" width="1440" height="960"></canvas></div><aside class="detail"><strong>细节放大 · 随光球移动</strong><canvas id="zoom" width="480" height="360"></canvas><canvas id="isolated" width="480" height="280"></canvas><p>上方：实际棋盘截图局部。<br>下方：同一效果在中性底色上的细节。<br>主画面保留实际大小，右侧仅放大检查形态。</p></aside></div>
<div class="steps"><button data-time="160">手牌激活</button><button data-time="340">聚光生成</button><button data-time="620">光球飞行</button><button data-time="930">落地涟漪</button><button data-time="1160">余辉消散</button></div><p class="note">使用当前游戏的棋盘与手牌截图模拟。此页使用已接入的正式效果；默认大小1.5倍。用户已授权接入，背景、棋盘、卡牌与玩法保持原样。</p></main><script type="module" src="preview.mjs"></script></html>
